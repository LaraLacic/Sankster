<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin Panel - Antique Bar</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display&display=swap" rel="stylesheet" />
    <style>
        body {
            font-family: 'Georgia', serif;
            background-color: #262626;
            color: #d9b99b;
            padding: 20px;
            text-align: center;
            margin: 0;
        }

        .navbar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 10px 20px;
            background-color: #333;
        }

        .login-button {
            font-size: 16px;
            padding: 8px 16px;
            border-radius: 20px;
            background-color: #d9b99b;
            color: #262626;
            text-decoration: none;
            transition: background-color 0.3s;
            font-weight: bold;
        }

        .login-button:hover {
            background-color: #c8a37e;
        }

        h1, h2 {
            font-family: 'Playfair Display', serif;
            color: #d9b99b;
        }

        h2 {
            margin-top: 30px;
            text-decoration: underline;
        }

        ul {
            list-style-type: none;
            padding: 0;
            max-width: 600px;
            margin: 0 auto;
            text-align: left;
        }

        li {
            background-color: #444;
            padding: 15px;
            margin: 10px 0;
            border-radius: 10px;
            box-shadow: 2px 2px 8px rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 18px;
            font-weight: bold;
        }

        li a {
            color: #d9b99b;
            text-decoration: none;
            font-weight: normal;
            margin-left: 10px;
            background-color: transparent;
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid #d9b99b;
            transition: background-color 0.3s, color 0.3s;
        }

        li a:hover {
            color: #262626;
            background-color: #d9b99b;
        }

        form {
            max-width: 400px;
            margin: 30px auto 0 auto;
            text-align: left;
            background-color: #3a3a3a;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #d9b99b;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.5);
        }

        label {
            font-weight: bold;
            font-size: 16px;
            display: block;
            margin-top: 15px;
        }

        input[type="text"],
        input[type="password"],
        select {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border: 1px solid #d9b99b;
            border-radius: 8px;
            background-color: #444;
            color: #d9b99b;
            font-size: 16px;
            font-family: 'Georgia', serif;
        }

        button {
            margin-top: 25px;
            padding: 12px;
            font-size: 18px;
            width: 100%;
            color: #262626;
            background-color: #d9b99b;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #c8a37e;
        }

        .back-form {
            max-width: 400px;
            margin: 40px auto 20px auto;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <a href="{% url 'logout' %}" class="login-button">Logout</a>
    </div>

    <h1>Admin Panel</h1>

    <h2>List of All Employees:</h2>
    <ul>
        {% for employee in employees %}
            <li>
                {{ employee.username }} - {{ employee.get_role_display }}
                <a href="{% url 'edit_worker' employee.id %}">Edit</a>
            </li>
        {% endfor %}
    </ul>

    <h2>Add New Employee:</h2>
    <form method="POST" action="{% url 'create_worker' %}">
        {% csrf_token %}
        <label for="id_username">Username:</label>
        <input type="text" name="username" id="id_username" required>

        <label for="id_password">Password:</label>
        <input type="password" name="password" id="id_password" required>

        <label for="id_role">Role:</label>
        <select name="role" id="id_role" required>
            <option value="server">Server</option>
            <option value="barista">Barista</option>
            <option value="admin">Admin</option>
        </select>

        <button type="submit">Add Employee</button>
    </form>

    <form method="POST" action="{% url 'admin_dashboard' %}" class="back-form">
        {% csrf_token %}
        <button type="submit">Back to Dashboard</button>
    </form>

</body>
</html>
