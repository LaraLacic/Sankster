<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Menu Management - Antique Bar</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Playfair+Display&display=swap" rel="stylesheet" />
    <style>
        body {
            font-family: 'Georgia', serif;
            background-color: #262626;
            color: #d9b99b;
            padding: 20px;
            margin: 0;
            text-align: center;
        }

        h2 {
            font-family: 'Cinzel Decorative', cursive;
            font-size: 40px;
            margin-top: 30px;
        }

        h3 {
            font-family: 'Playfair Display', serif;
            margin-top: 30px;
            text-decoration: underline;
            font-size: 28px;
        }

        form {
            max-width: 400px;
            margin: 20px auto;
            padding: 20px;
            background-color: #3a3a3a;
            border: 1px solid #d9b99b;
            border-radius: 12px;
            text-align: left;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.5);
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
            font-size: 18px;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border: 1px solid #d9b99b;
            border-radius: 8px;
            background-color: #444;
            color: #d9b99b;
            font-size: 16px;
            font-family: 'Georgia', serif;
        }

        button {
            margin-top: 20px;
            background-color: #d9b99b;
            color: #262626;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 20px;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.3s;
            outline: none;
        }

        button:hover {
            background-color: #c8a37e;
        }

        .menu-items {
            max-width: 600px;
            margin: 40px auto 20px auto;
            text-align: left;
        }

        .menu-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            border: 1px solid #d9b99b;
            border-radius: 12px;
            background-color: #3a3a3a;
            margin-bottom: 10px;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.5);
        }

        .menu-item span {
            font-size: 20px;
            font-weight: bold;
        }

        .menu-item div {
            display: flex;
            gap: 10px;
            align-items: center; 
        }

        .menu-item button {
            width: auto;
            padding: 8px 16px;
            font-size: 16px;
            border-radius: 20px;
            outline: none; 
        }

        .edit-btn {
            background-color: #d9b99b;
            color: #262626;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .edit-btn:hover {
            background-color: #c8a37e;
        }

        .delete-btn {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
            outline: none !important;
            box-shadow: none !important;
        }

        .delete-btn:hover {
            background-color: #c82333;
            outline: none !important;
            box-shadow: none !important;
        }

        .delete-btn:focus,
        .delete-btn:active {
            outline: none !important;
            box-shadow: none !important;
            border: none !important;
        }

        .back-form {
            max-width: 500px;
            margin: 40px auto 20px auto;
            text-align: center;
        }

        .back-form button {
            padding: 10px 20px;
            font-size: 16px;
            color: #262626;
            background-color: #d9b99b;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: background-color 0.3s;
            width: 100%;
            font-weight: bold;
            outline: none;
        }

        .back-form button:hover {
            background-color: #c8a37e;
        }

    </style>
</head>
<body>

    <h2>Menu Management</h2>

    <form method="post">
        {% csrf_token %}
        <label for="id_name">Name:</label>
        {{ form.name }}

        <label for="id_description">Description:</label>
        {{ form.description }}

        <label for="id_price">Price:</label>
        {{ form.price }}

        <button type="submit">Add Item</button>
    </form>

    <div class="menu-items">
        <h3>Menu</h3>
        {% for item in menu_items %}
            <div class="menu-item">
                <span>{{ item.name }} - €{{ item.price }}</span>
                <div>
                    <a href="{% url 'edit_menu_item' item.id %}">
                        <button type="button" class="edit-btn">Edit</button>
                    </a>
                    <form method="post" action="{% url 'delete_menu_item' item.id %}">
                        {% csrf_token %}
                        <button class="delete-btn" type="submit">Delete</button>
                    </form>
                </div>
            </div>
        {% endfor %}
    </div>

    <form method="POST" action="{% url 'admin_dashboard' %}" class="back-form">
        {% csrf_token %}
        <button type="submit">Back to Dashboard</button>
    </form>

</body>
</html>
