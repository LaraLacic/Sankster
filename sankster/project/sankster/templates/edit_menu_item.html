<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Menu Item - Antique Bar</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Playfair+Display&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Georgia', serif;
            background-color: #262626;
            color: #d9b99b;
            padding: 20px;
            margin: 0;
            text-align: center;
        }

        h2 {
            font-family: 'Cinzel Decorative', cursive;
            font-size: 36px;
            margin-bottom: 20px;
        }

        form {
            max-width: 500px;
            margin: 0 auto 30px auto;
            background-color: #444;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.5);
            text-align: left;
        }

        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border-radius: 5px;
            border: 1px solid #d9b99b;
            background-color: #333;
            color: #d9b99b;
        }

        button {
            margin-top: 20px;
            background-color: #d9b99b;
            color: #262626;
            padding: 10px 20px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
            width: 100%;
        }

        button:hover {
            background-color: #c8a37e;
        }

        .back-link {
            display: inline-block;
            margin-top: 10px;
            color: #d9b99b;
            text-decoration: underline;
        }

        .back-link:hover {
            color: #c8a37e;
        }
    </style>
</head>
<body>

    <h2>Edit item: {{ item.name }}</h2>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save Changes</button>
    </form>

    <a href="{% url 'manage_menu' %}" class="back-link">← Back to Menu Management</a>

</body>
</html>
