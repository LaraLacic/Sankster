<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Server Panel - Antique Bar</title>
    <style>
        body {
            font-family: 'Georgia', serif;
            background-color: #262626;
            color: #d9b99b;
            padding: 20px;
            margin: 0;
            text-align: center;
        }

        .navbar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 10px 20px;
            background-color: #333;
        }

        .login-button, button {
            font-size: 16px;
            padding: 8px 16px;
            border-radius: 20px;
            background-color: #d9b99b;
            color: #262626;
            text-decoration: none;
            transition: background-color 0.3s;
            font-weight: bold;
            cursor: pointer;
            border: none;
        }

        .login-button:hover, button:hover {
            background-color: #c8a37e;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            color: #d9b99b;
            text-decoration: underline;
            margin-bottom: 30px;
        }

        h2 {
            color: #d9b99b;
            text-decoration: underline;
            margin-bottom: 15px;
        }

        ul {
            list-style-type: none;
            padding: 0;
            max-width: 600px;
            margin: 0 auto;
            text-align: left;
        }

        li {
            background-color: #444;
            padding: 15px;
            margin: 10px 0;
            border-radius: 10px;
            box-shadow: 2px 2px 8px rgba(0, 0, 0, 0.5);
            font-size: 18px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .buttons {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .buttons a,
        .buttons button {
            font-size: 16px;
            padding: 8px 16px;
            border-radius: 20px;
            background-color: #d9b99b;
            color: #262626;
            text-decoration: none;
            transition: background-color 0.3s;
            font-weight: bold;
            cursor: pointer;
            border: none;
        }

        .buttons a:hover,
        .buttons button:hover {
            background-color: #c8a37e;
        }

        .buttons form {
            margin: 0;
        }

        .footer {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .footer form button {
            margin: 0;
        }

        p {
            font-style: italic;
            color: #c8a37e;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <form method="POST" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit">Logout</button>
        </form>
    </div>

    <h1>Server Panel</h1>

    <h2>Active Orders:</h2>
    <ul>
        {% for order in active_orders %}
            <li id="order-{{ order.id }}">
                <span>{{ order }}</span>

                <div class="buttons">
                    <a href="{% url 'order_detail' order.id %}">Add Items</a>

                    {% if order.status == 'pending' %}
                        <form method="POST" action="{% url 'mark_order_received' order.id %}">
                            {% csrf_token %}
                            <button type="submit">Received</button>
                        </form>
                    {% endif %}

                    {% if order.status != 'Completed' %}
                        <form method="POST" action="{% url 'mark_order_delivered' order.id %}">
                            {% csrf_token %}
                            <button type="submit">Delivered</button>
                        </form>
                    {% endif %}
                </div>
            </li>
        {% endfor %}
    </ul>

    <div class="footer">
        <form method="POST" action="{% url 'create_order' %}">
            {% csrf_token %}
            <button type="submit">Create New Order</button>
        </form>
    </div>

    <script>
        function fetchOrderStatus() {
            fetch("/get-order-status/")
            .then(response => response.json())
            .then(data => {
                if (data.orders) {
                    data.orders.forEach(order => {
                        let orderElement = document.getElementById(`order-${order.id}`);
                        if (orderElement) {
                            let statusElement = orderElement.querySelector(".order-status");
                            if (statusElement) {
                                statusElement.innerText = " (Status: " + order.status + ")";
                            }
                        }
                    });
                }
            })
            .catch(error => console.error("Error fetching order status:", error));
        }

        setInterval(fetchOrderStatus, 5000);
    </script>

</body>
</html>
