<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Antique Bar</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Playfair+Display&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Georgia', serif;
            background-color: #262626;
            color: #d9b99b;
            padding: 20px;
            text-align: center;
            margin: 0;
        }

        .navbar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 10px 20px;
            background-color: #333;
        }

        .logout-button {
            font-size: 16px;
            padding: 8px 16px;
            border-radius: 20px;
            background-color: #d9b99b;
            color: #262626;
            text-decoration: none;
            transition: background-color 0.3s;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }

        .logout-button:hover {
            background-color: #c8a37e;
        }

        h1 {
            font-family: 'Cinzel Decorative', cursive;
            font-size: 48px;
            margin-top: 30px;
        }

        h2 {
            font-family: 'Playfair Display', serif;
        }

        ul {
            list-style-type: none;
            padding: 0;
        }

        li {
            font-size: 18px;
            margin: 8px 0;
        }

        .button-container {
            margin: 40px auto;
        }

        .button-container a {
            text-decoration: none;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 20px;
            background-color: #d9b99b;
            color: #262626;
            font-weight: bold;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s;
            margin: 10px;
        }

        button:hover {
            background-color: #c8a37e;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <form method="POST" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit" class="logout-button">Logout</button>
        </form>
    </div>

    <h1>Admin Panel</h1>

    <div class="button-container">
        <a href="{% url 'manage_menu' %}">
            <button type="button">Edit Menu</button>
        </a>
        <a href="{% url 'manage_staff' %}">
            <button type="button">Manage Staff</button>
        </a>
    </div>

</body>
</html>
